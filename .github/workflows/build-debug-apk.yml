name: Build and Release Mango.brrrBoard APK

on:
  push:
    branches:
      - "real-*"
  workflow_dispatch:
    inputs:
      description:
        description: 'Release milestone description'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Manual runs always build. Push runs build only for an explicit
    # milestone commit whose message starts with "release:".
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare and verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        id: verify-apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug/ -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in expected directory"
            exit 1
          fi
          test -s "$APK_PATH"
          echo "Found APK at: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="build-${SHORT_SHA}"

          DESC="${{ inputs.description }}"
          if [ -z "$DESC" ]; then
            TITLE="brrrBoard Milestone — ${SHORT_SHA}"
            NOTES="Automated milestone release from commit ${GITHUB_SHA}."
          else
            TITLE="brrrBoard Milestone — $DESC"
            NOTES="Milestone: $DESC
Commit: ${GITHUB_SHA}"
          fi

          APK_PATH="${{ steps.verify-apk.outputs.apk_path }}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to create."
          else
            gh release create "$TAG"               "$APK_PATH"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$TITLE"               --notes "$NOTES"               --prerelease
          fi

      - name: Archive reports for failed job
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            build/reports
          if-no-files-found: warn
