name: Build Mango.brrrBoard debug APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish this APK as a GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Verify pinned Gradle version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          ACTUAL="$(./gradlew --version | awk '/^Gradle / {print $2; exit}')"
          test "$ACTUAL" = "8.14.4"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mango-brrrBoard-debug
          path: app/build/outputs/apk/debug/Mango_brrrBoard_2.5.7-debug.apk
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mango-2.5.7-test-${GITHUB_SHA::7}"
          gh release create "$TAG" "app/build/outputs/apk/debug/Mango_brrrBoard_2.5.7-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mango.brrrBoard 2.5.7 Test — ${GITHUB_SHA::7}" \
            --notes "Development test build from mangoloads/privacy-cleanup-v1." \
            --prerelease

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            build/reports
          if: ${{ failure() }}
          if-no-files-found: warn
