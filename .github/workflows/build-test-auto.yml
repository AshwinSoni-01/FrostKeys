name: Test build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Use project Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon testRunTestsUnitTest

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            build/reports
          if: ${{ failure() }}
          if-no-files-found: warn
