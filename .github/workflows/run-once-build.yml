name: One-shot brrrBoard APK build
# trigger: latest source-fix validation

on:
  push:
    branches:
      - "real-*"

permissions:
  contents: write

concurrency:
  group: one-shot-brrrboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Inspect Java/Kotlin compilation boundary
        shell: bash
        run: |
          set +e
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --no-configuration-cache --no-build-cache --stacktrace
          JAVA_RC=$?
          echo "compileDebugJavaWithJavac exit=$JAVA_RC"
          echo "=== KeyboardSwitcher.class candidates ==="
          find app/build -type f -name 'KeyboardSwitcher.class' -print
          echo "=== javap candidates ==="
          for f in $(find app/build -type f -name 'KeyboardSwitcher.class'); do
            d="$(dirname "$f")"
            echo "--- $f ---"
            javap -public -classpath "$d" helium314.keyboard.keyboard.KeyboardSwitcher 2>&1 | sed -n '1,220p'
          done
          echo "=== Relevant Gradle tasks ==="
          ./gradlew :app:tasks --all --no-daemon --no-configuration-cache --no-build-cache | grep -E 'compileDebug(JavaWithJavac|Kotlin)|kotlin.*Debug' || true
          exit 0

      - name: Build debug APK
        run: ./gradlew --no-daemon --no-configuration-cache --no-build-cache --stacktrace clean assembleDebug

      - name: Dump Kotlin Java stubs on build failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          echo "=== All KeyboardSwitcher build artifacts ==="
          find app/build -type f \( -name '*KeyboardSwitcher*' -o -name 'KeyboardSwitcher.java' \) -print
          echo "=== Generated Java source references ==="
          grep -RIn --include='*.java' --include='*.kt' 'class KeyboardSwitcher' app/build 2>/dev/null | head -80
          echo "=== Generated stub declaration ==="
          for f in $(grep -Rl --include='*.java' 'class KeyboardSwitcher' app/build 2>/dev/null); do
            echo "--- $f ---"
            grep -n -B4 -A20 'class KeyboardSwitcher' "$f" | head -80
          done

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/Mango_brrrBoard_2.5.7-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mango-brrrBoard-debug
          path: app/build/outputs/apk/debug/Mango_brrrBoard_2.5.7-debug.apk
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mango-2.5.7-test-${GITHUB_SHA::7}"

          gh release create "$TAG" \
            "app/build/outputs/apk/debug/Mango_brrrBoard_2.5.7-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mango.brrrBoard 2.5.7 Test — ${GITHUB_SHA::7}" \
            --notes "One-shot validation build from mangaloads/brrrBoard." \
            --prerelease

      - name: Remove one-shot workflow
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/run-once-build.yml" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/run-once-build.yml" \
            -f message="ci: remove one-shot APK workflow" \
            -f sha="$FILE_SHA" \
            -f branch="${GITHUB_REF_NAME}"
