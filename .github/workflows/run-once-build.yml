name: One-shot brrrBoard APK build

on:
  push:
    branches:
      - mangaloads/brrrBoard

permissions:
  contents: write

concurrency:
  group: one-shot-brrrboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/Mango_brrrBoard_2.5.7-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mango-brrrBoard-debug
          path: app/build/outputs/apk/debug/Mango_brrrBoard_2.5.7-debug.apk
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mango-2.5.7-test-${GITHUB_SHA::7}"

          gh release create "$TAG" \
            "app/build/outputs/apk/debug/Mango_brrrBoard_2.5.7-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mango.brrrBoard 2.5.7 Test — ${GITHUB_SHA::7}" \
            --notes "One-shot validation build from mangaloads/brrrBoard." \
            --prerelease

      - name: Remove one-shot workflow
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/run-once-build.yml" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/run-once-build.yml" \
            -f message="ci: remove one-shot APK workflow" \
            -f sha="$FILE_SHA" \
            -f branch="${GITHUB_REF_NAME}"
