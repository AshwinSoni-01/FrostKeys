name: Sync Upstream, Build and Release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with Upstream
        id: sync
        run: |
          git remote add upstream https://github.com/AshwinSoni-01/FrostKeys.git || git remote set-url upstream https://github.com/AshwinSoni-01/FrostKeys.git
          git fetch upstream
          UPSTREAM_BRANCH=$(git remote show upstream | sed -n '/HEAD branch/s/.*: //p')
          [ -z "$UPSTREAM_BRANCH" ] && UPSTREAM_BRANCH="main"
          
          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/$UPSTREAM_BRANCH)
          
          if [ "$LOCAL_HASH" = "$UPSTREAM_HASH" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No updates detected in upstream. Terminating pipeline."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream changes detected or manual dispatch initiated. Merging..."
            git merge upstream/$UPSTREAM_BRANCH --no-edit || git reset --hard upstream/$UPSTREAM_BRANCH
            git push origin main
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore or initialize persistent keystore
        if: steps.sync.outputs.has_updates == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Set up JDK 17
        if: steps.sync.outputs.has_updates == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        if: steps.sync.outputs.has_updates == 'true'
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        if: steps.sync.outputs.has_updates == 'true'
        run: chmod +x gradlew

      - name: Build debug APK
        if: steps.sync.outputs.has_updates == 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish GitHub Release
        if: steps.sync.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v$(date +'%Y.%m.%d')-${SHORT_SHA}"
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found."
            exit 1
          fi
          
          gh release create "$TAG" "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --title "brrBoard $TAG" \
            --notes "Automated build synced from upstream repository AshwinSoni-01/FrostKeys."
